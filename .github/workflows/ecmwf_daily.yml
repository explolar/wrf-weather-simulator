name: Daily forecast update (ECMWF IFS, ECMWF AIFS, NOAA GFS, DWD ICON)

on:
  schedule:
    # 05:00 UTC ≈ 10:30 IST — well after the 00Z run is published (~4-6h lag)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Forecast init cycle"
        required: false
        default: "00"
        type: choice
        options: ["00", "06", "12", "18"]

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system eccodes library
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ECMWF IFS pipeline (all zones)
        continue-on-error: true   # don't let one model's bug skip the other three + the commit
        run: >
          python ecmwf_pipeline.py
          --source opendata --model ifs
          --cycle ${{ inputs.cycle || '00' }}
          --zone all --no-git

      - name: Run ECMWF AIFS pipeline (all zones)
        continue-on-error: true   # AIFS open-data availability/params are less battle-tested than IFS
        run: >
          python ecmwf_pipeline.py
          --source opendata --model aifs-single
          --cycle ${{ inputs.cycle || '00' }}
          --zone all --no-git

      - name: Run NOAA GFS pipeline (all zones)
        continue-on-error: true   # don't let a NOMADS hiccup block the IFS commit
        run: >
          python gfs_pipeline.py
          --cycle ${{ inputs.cycle || '00' }}
          --zone all --no-git

      - name: Run DWD ICON pipeline (all zones)
        continue-on-error: true   # newest/most complex integration (icosahedral remap) — isolate failures
        run: >
          python icon_pipeline.py
          --cycle ${{ inputs.cycle || '00' }}
          --zone all --no-git

      - name: Commit and push updated forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ecmwf_ifs_*.json ecmwf_aifs_*.json gfs_*.json icon_*.json index.html
          git diff --cached --quiet && echo "No forecast changes to commit." && exit 0
          git commit -m "data: automated forecast update ($(date -u +%Y-%m-%d) ${{ inputs.cycle || '00' }}Z, IFS/AIFS/GFS/ICON)"

          # The checkout is taken at job start but this job can run 20-30+ min
          # (ICON alone is ~600 small downloads) — if main moved in the
          # meantime (e.g. a manual push), a plain `git push` 404/non-fast-
          # forward-rejects and the whole run's output is lost since the
          # runner is ephemeral. Rebase onto the latest main and retry.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) — fetching + rebasing onto latest origin/main ..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — aborting rebase, will retry next attempt."
              git rebase --abort
            fi
            sleep $((5 * i))
          done
          echo "Failed to push after retries."
          exit 1
